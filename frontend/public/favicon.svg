<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Cyan glow for nodes -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Purple glow for nodes -->
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Football outer stitching/circles -->
  <circle cx="16" cy="16" r="14" stroke="#ffffff" stroke-width="1.2" opacity="0.15" />
  
  <!-- Neural connections forming football panels -->
  <!-- Top panel connections -->
  <path d="M16 4 L11 10 L16 16 L21 10 Z" stroke="#8a2be2" stroke-width="1" opacity="0.6" />
  <!-- Bottom panel connections -->
  <path d="M16 28 L11 22 L16 16 L21 22 Z" stroke="#00f2fe" stroke-width="1" opacity="0.6" />
  <!-- Left panel connections -->
  <path d="M4 16 L11 10 L11 22 Z" stroke="#8a2be2" stroke-width="1" opacity="0.5" />
  <!-- Right panel connections -->
  <path d="M28 16 L21 10 L21 22 Z" stroke="#00f2fe" stroke-width="1" opacity="0.5" />

  <!-- Diagonal outer stitching -->
  <line x1="4" y1="16" x2="11" y2="10" stroke="#8a2be2" stroke-width="1" opacity="0.5" />
  <line x1="28" y1="16" x2="21" y2="10" stroke="#00f2fe" stroke-width="1" opacity="0.5" />
  <line x1="4" y1="16" x2="11" y2="22" stroke="#8a2be2" stroke-width="1" opacity="0.5" />
  <line x1="28" y1="16" x2="21" y2="22" stroke="#00f2fe" stroke-width="1" opacity="0.5" />
  <line x1="16" y1="4" x2="11" y2="10" stroke="#8a2be2" stroke-width="1" opacity="0.6" />
  <line x1="16" y1="4" x2="21" y2="10" stroke="#00f2fe" stroke-width="1" opacity="0.6" stroke-dasharray="2 1" />
  <line x1="16" y1="28" x2="11" y2="22" stroke="#8a2be2" stroke-width="1" opacity="0.6" stroke-dasharray="2 1" />
  <line x1="16" y1="28" x2="21" y2="22" stroke="#00f2fe" stroke-width="1" opacity="0.6" />

  <!-- Glowing Neural Nodes at panel intersections -->
  <circle cx="16" cy="4" r="2" fill="#8a2be2" filter="url(#glow-purple)" />
  <circle cx="16" cy="28" r="2" fill="#00f2fe" filter="url(#glow-cyan)" />
  <circle cx="4" cy="16" r="2" fill="#8a2be2" filter="url(#glow-purple)" />
  <circle cx="28" cy="16" r="2" fill="#00f2fe" filter="url(#glow-cyan)" />
  
  <circle cx="11" cy="10" r="2.5" fill="#8a2be2" filter="url(#glow-purple)" />
  <circle cx="21" cy="10" r="2.5" fill="#00f2fe" filter="url(#glow-cyan)" />
  <circle cx="11" cy="22" r="2.5" fill="#00f2fe" filter="url(#glow-cyan)" />
  <circle cx="21" cy="22" r="2.5" fill="#8a2be2" filter="url(#glow-purple)" />
  <circle cx="16" cy="16" r="3" fill="#ffffff" filter="url(#glow-cyan)" opacity="0.9" />
</svg>