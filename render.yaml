# render.yaml
services:
  # Python Backend Service
  - type: web
    name: neuropitch-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .

  # Vite React Frontend Service (Static Site)
  - type: web
    name: neuropitch-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://neuropitch-backend.onrender.com
